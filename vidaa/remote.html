<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALO TV Remote</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#303958,#090d18 60%);font:18px Arial,sans-serif;color:#f5f7ff;padding:24px}main{max-width:460px;margin:20px auto}.card{padding:26px;border:1px solid #59637b;border-radius:24px;background:rgba(255,255,255,.09);margin:20px 0}h1{letter-spacing:4px}label{display:block;margin:12px 0}input{width:100%;padding:16px;font-size:24px;border-radius:12px;border:1px solid #8393b0;background:#152138;color:white}button{border:0;border-radius:14px;padding:17px;font-size:19px;font-weight:bold;background:#e5d8f1;color:#161b31;cursor:pointer;min-height:58px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button{width:100%}#status{line-height:1.5;color:#ffd9a8}input[type=range]{accent-color:#ffc0d4}button:focus,input:focus{outline:3px solid #ffbb72}</style></head><body><main><h1>◉ HALO REMOTE</h1><p>Control music on your Hisense TV from this phone.</p><section class="card" id="pairing"><label for="code">6-digit code shown on HALO TV</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000"><p><button id="pair">Pair with TV</button></p></section><section class="card" id="controls" hidden><div class="grid"><button data-cmd="play_pause">▶ / Ⅱ</button><button data-cmd="stop">■ Stop</button><button data-cmd="mute">Mute / Unmute</button><button id="disconnect">Disconnect</button></div><label for="volume">TV music volume: <span id="volLabel">35</span>%</label><input type="range" id="volume" min="0" max="100" value="35"><button id="sendVolume">Set volume</button><hr style="border:0;border-top:1px solid #65708a;margin:26px 0"><h2>JARVIS · Text commands</h2><p>Try: play music, pause music, stop, mute, unmute, volume 50</p><label for="jarvisInput">Command</label><input id="jarvisInput" placeholder="Jarvis, play music" maxlength="100"><p><button id="jarvisSend">Send to Jarvis</button></p></section><section class="card"><p id="status" aria-live="polite">Enter the pairing code shown on the TV.</p></section></main><script>(function(){'use strict';var HALO_URL='https://qexsishqkunaxyeadkhl.supabase.co',HALO_KEY='sb_publishable_wwwtkf43rOfS1d2O_mMpEg_tqIdg02i';var token=null,session=null;function el(id){return document.getElementById(id)}function status(t){el('status').textContent=t}function api(path,data,t){return fetch(HALO_URL+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':HALO_KEY,'Authorization':'Bearer '+(t||HALO_KEY)},body:JSON.stringify(data||{})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(j.msg||j.message||j.error_description||j.error||'HTTP '+r.status);return j})})}function auth(){var old=null;try{old=JSON.parse(localStorage.getItem('halo-remote-auth')||'null')}catch(e){}if(old&&old.access_token&&old.expires_at>Date.now()/1000+60)return Promise.resolve(old.access_token);return api('/auth/v1/signup',{},null).then(function(j){if(!j.access_token)throw Error('Enable anonymous sign-ins in Supabase Authentication');try{localStorage.setItem('halo-remote-auth',JSON.stringify({access_token:j.access_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)}))}catch(e){}return j.access_token})}function send(cmd,val){if(!token||!session)return;status('Sending '+cmd+'…');api('/rest/v1/rpc/halo_send_command',{p_session_id:session,p_command:cmd,p_value:val===undefined?null:val},token).then(function(){status('Command queued: '+cmd+'. Check TV playback.')}).catch(function(e){status('Command failed: '+e.message)})}el('pair').onclick=function(){var code=el('code').value.trim();if(!/^[0-9]{6}$/.test(code)){status('Enter the six digits displayed on TV.');return}el('pair').disabled=true;status('Connecting to HALO TV…');auth().then(function(t){token=t;return api('/rest/v1/rpc/halo_pair_phone',{p_code:code},t)}).then(function(j){if(!j.paired||!j.session_id)throw Error(j.error||'Pairing was rejected');session=j.session_id;el('pairing').hidden=true;el('controls').hidden=false;status('Paired! Try Play/Pause on your phone.')}).catch(function(e){status('Pairing failed: '+e.message)}).then(function(){el('pair').disabled=false})};var buttons=document.querySelectorAll('[data-cmd]');for(var i=0;i<buttons.length;i++)buttons[i].onclick=function(){send(this.getAttribute('data-cmd'))};el('volume').oninput=function(){el('volLabel').textContent=this.value};el('sendVolume').onclick=function(){send('volume',Number(el('volume').value))};function jarvisCommand(){
var phrase=el('jarvisInput').value.toLowerCase().replace(/^\\s*(hey\\s+)?jarvis[,:]?\\s*/,'').trim();
var volume=phrase.match(/(?:volume|sound)\\s*(?:to|at|=)?\\s*(\\d{1,3})/);
if(volume){var v=Number(volume[1]);if(v>100){status('Jarvis: volume must be 0–100.');return;}send('volume',v);status('Jarvis: setting music volume to '+v+'%.');return;}
if(/^(play|resume|start)(\\s+music)?$/.test(phrase)){send('play_pause');status('Jarvis: toggling music playback.');return;}
if(/^(pause)(\\s+music)?$/.test(phrase)){send('play_pause');status('Jarvis: toggling music playback.');return;}
if(/^(stop)(\\s+music)?$/.test(phrase)){send('stop');status('Jarvis: stopping music.');return;}
if(/^(mute|unmute)(\\s+music)?$/.test(phrase)){send('mute');status('Jarvis: toggling mute.');return;}
status('Jarvis: command not recognized. Try play music, stop, mute, or volume 50.');
}
el('jarvisSend').onclick=jarvisCommand;
el('jarvisInput').onkeydown=function(e){if((e.keyCode||e.which)===13)jarvisCommand();};
el('disconnect').onclick=function(){session=null;el('pairing').hidden=false;el('controls').hidden=true;status('Remote disconnected on this phone. Generate a new TV pairing code to revoke this phone.');};})();</script></body></html>
